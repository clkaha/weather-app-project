			<h1 align="center">Find a weather forecast</h1>
			<form id="search-form">
				<input
					type="search"
					name=""
					id="search-input"
					placeholder="Enter a city..."
					required
				/>
				<input type="submit" id="search-submit" value="Search" />
			</form>
			<h2 id="city-name">City name</h2>
			<h3 id="todays-weather-heading">Today's weather forecast</h3>
			<div id="weather-today">

					<p id="conditions-today">
						<span id="description-today"></span><br />
						Humidity: <span id="humidity-value"></span> <br />
						Wind: <span id="windspeed"></span>
					</p>
				</div>
				<div id="temperature-today">
					<div id="temperature-today-icon"><img src="" alt="" /></div>
					<div id="temperature-today-values">
						<span id="temperature-today-max"></span><br /><span
							id="temperature-today-min"
						></span>
					</div>
				</div>
			</div>
			<div>
